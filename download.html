<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeamDrop - Universal Device Bridge</title>
  <script src="/libs/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #111827 0%, #030712 100%);
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    /* Isolated Download Box */
    .download-card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(55, 65, 81, 0.8);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(56, 189, 248, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* File Icon Representation */
    .file-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .file-pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 26px;
      border: 2px solid #38bdf8;
      opacity: 0;
      animation: pulseBorder 2s infinite ease-out;
    }

    @keyframes pulseBorder {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .file-badge-tag {
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #38bdf8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .file-name {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
      max-width: 100%;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .file-info {
      font-size: 12px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, monospace;
      margin-bottom: 22px;
    }

    /* Stream Progress Container */
    .stream-container {
      width: 100%;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 10px;
    }

    .stream-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #38bdf8;
      animation: blink 1.5s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .stream-speed {
      font-family: ui-monospace, monospace;
      color: #38bdf8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 9999px;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .stream-bytes {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: #94a3b8;
    }

    /* Action Buttons */
    .btn-download-action {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.5);
    }

    .btn-download-action:active {
      transform: scale(0.98);
    }

    .btn-download-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-icon-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Text & Link Payload Container */
    .text-payload-container {
      display: none;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 16px;
      text-align: left;
    }

    .text-box {
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #f1f5f9;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      line-height: 1.5;
    }

    .text-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
    }

    .btn-text-action {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-text-action:hover, .btn-text-action:active {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .btn-primary-action {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    /* Success Alert */
    .success-box {
      display: none;
      width: 100%;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
      text-align: left;
    }

    /* Media Preview Container */
    .preview-box {
      display: none;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid #334155;
      background: #000000;
      max-height: 240px;
    }

    .preview-box img, .preview-box video {
      width: 100%;
      height: 100%;
      max-height: 240px;
      object-fit: contain;
      display: block;
    }

    .privacy-tag {
      font-size: 10px;
      color: #475569;
      font-family: ui-monospace, monospace;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- Dedicated Isolated Direct Gateway Card -->
  <div class="download-card">
    <div class="file-icon-wrap">
      <div id="pulseRing" class="file-pulse-ring"></div>
      <span id="fileEmoji">⚡</span>
    </div>

    <span id="portalBadgeTag" class="file-badge-tag">DIRECT P2P BRIDGE</span>
    <h1 id="fileNameHeading" class="file-name">Connecting to Device...</h1>
    <p id="fileSizeLabel" class="file-info">RAM-to-RAM Stream • Zero Storage</p>

    <!-- Real-Time Transfer Indicator -->
    <div id="streamContainer" class="stream-container">
      <div class="stream-header">
        <div class="stream-status">
          <span class="status-dot"></span>
          <span id="transferStatusText">Establishing direct WebRTC link...</span>
        </div>
        <span id="transferSpeedText" class="stream-speed">-- MB/s</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>

      <div class="stream-bytes">
        <span id="progressPctLabel">0%</span>
        <span id="bytesTransferredLabel">Connecting...</span>
      </div>
    </div>

    <!-- Text / Link Payload Container -->
    <div id="textPayloadContainer" class="text-payload-container">
      <div id="textBox" class="text-box"></div>
      <div class="text-actions">
        <button id="btnCopyText" class="btn-text-action btn-primary-action" type="button">
          <span>📋 Copy to Clipboard</span>
        </button>
        <a id="btnOpenLink" class="btn-text-action" href="#" target="_blank" style="display: none;">
          <span>🔗 Open Link</span>
        </a>
      </div>
    </div>

    <!-- Success Feedback -->
    <div id="successBox" class="success-box">
      <span>✓</span>
      <div>
        <strong id="successTitle">Transfer Complete!</strong>
        <p id="successSub" style="font-weight: 400; opacity: 0.9; font-size: 11px;">The object was streamed directly into your device.</p>
      </div>
    </div>

    <!-- Prominent Direct Action Button -->
    <button id="btnDownload" class="btn-download-action" disabled>
      <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      <span id="btnDownloadText">Connecting...</span>
    </button>

    <!-- In-Line Media Preview -->
    <div id="previewBox" class="preview-box"></div>

    <p class="privacy-tag">🔒 Encrypted RAM-to-RAM Bridge • No Server Storage</p>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const peerId = urlParams.get('peer') || (window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '');
      const expectedType = urlParams.get('type') || 'file'; // 'file' | 'text' | 'link'
      const expectedName = decodeURIComponent(urlParams.get('name') || urlParams.get('file') || (expectedType === 'text' ? 'Beamed Text' : 'Shared Object'));
      const expectedSize = parseInt(urlParams.get('size') || '0', 10);
      const expectedMime = decodeURIComponent(urlParams.get('mime') || '');

      const fileNameHeading = document.getElementById('fileNameHeading');
      const fileSizeLabel = document.getElementById('fileSizeLabel');
      const fileEmoji = document.getElementById('fileEmoji');
      const portalBadgeTag = document.getElementById('portalBadgeTag');
      const streamContainer = document.getElementById('streamContainer');
      const transferStatusText = document.getElementById('transferStatusText');
      const transferSpeedText = document.getElementById('transferSpeedText');
      const progressBarFill = document.getElementById('progressBarFill');
      const progressPctLabel = document.getElementById('progressPctLabel');
      const bytesTransferredLabel = document.getElementById('bytesTransferredLabel');
      const textPayloadContainer = document.getElementById('textPayloadContainer');
      const textBox = document.getElementById('textBox');
      const btnCopyText = document.getElementById('btnCopyText');
      const btnOpenLink = document.getElementById('btnOpenLink');
      const successBox = document.getElementById('successBox');
      const successTitle = document.getElementById('successTitle');
      const successSub = document.getElementById('successSub');
      const btnDownload = document.getElementById('btnDownload');
      const btnDownloadText = document.getElementById('btnDownloadText');
      const previewBox = document.getElementById('previewBox');
      const pulseRing = document.getElementById('pulseRing');

      fileNameHeading.textContent = expectedName;
      document.title = "BeamDrop - " + expectedName;

      // Full High-Speed STUN + TURN Relay Matrix (Guarantees 4G/5G and Mobile Firewall Connectivity)
      const ICE_SERVERS = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' },
        { urls: 'stun:stun.relay.metered.ca:80' },
        {
          urls: 'turn:standard.relay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:standard.relay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:standard.relay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ];

      if (expectedType === 'text' || expectedType === 'link') {
        portalBadgeTag.textContent = 'INSTANT TEXT BRIDGE';
        fileEmoji.textContent = expectedType === 'link' ? '🔗' : '📝';
        fileSizeLabel.textContent = 'Direct Text Transmission';
        btnDownloadText.textContent = 'Awaiting Text...';
      } else if (expectedSize > 0) {
        fileSizeLabel.textContent = formatBytes(expectedSize) + " • Direct Download Link";
        btnDownloadText.textContent = "Download (" + formatBytes(expectedSize) + ")";
      } else {
        fileSizeLabel.textContent = "Direct Download Link";
        btnDownloadText.textContent = "Connecting to sender...";
      }

      // Format Icon
      if (expectedName.match(/\.(xlsx?|csv|ods|tsv)$/i) || expectedMime.includes('spreadsheet') || expectedMime.includes('excel')) {
        fileEmoji.textContent = '📊';
      } else if (expectedName.match(/\.(pptx?|ppsx?|odp)$/i) || expectedMime.includes('presentation')) {
        fileEmoji.textContent = '📽️';
      } else if (expectedName.match(/\.pdf$/i) || expectedMime === 'application/pdf') {
        fileEmoji.textContent = '📑';
      } else if (expectedName.match(/\.(docx?|rtf|odt)$/i) || expectedMime.includes('word')) {
        fileEmoji.textContent = '📄';
      } else if (expectedName.match(/\.(jpg|jpeg|png|webp|gif|svg)$/i) || expectedMime.startsWith('image/')) {
        fileEmoji.textContent = '🖼️';
      } else if (expectedName.match(/\.(mp4|webm|mov|mkv|avi)$/i) || expectedMime.startsWith('video/')) {
        fileEmoji.textContent = '🎬';
      } else if (expectedName.match(/\.(zip|rar|7z|tar|gz)$/i)) {
        fileEmoji.textContent = '📦';
      } else if (expectedName.match(/\.(mp3|wav|flac|m4a|aac)$/i) || expectedMime.startsWith('audio/')) {
        fileEmoji.textContent = '🎵';
      }

      if (!peerId) {
        transferStatusText.textContent = "No active peer ID provided in URL";
        btnDownloadText.textContent = "Invalid Download Link";
        return;
      }

      let peer = null;
      let connection = null;
      let currentDownloadUrl = null;
      let activeFileName = expectedName;
      let isCompleted = false;
      const chunksMap = new Map();

      function initP2P() {
        const receiverId = 'dl-' + Math.random().toString(36).substring(2, 9);
        peer = new Peer(receiverId, {
          debug: 1,
          config: {
            iceServers: ICE_SERVERS
          }
        });

        peer.on('open', function() {
          transferStatusText.textContent = "Connecting to sender...";
          connection = peer.connect(peerId, { reliable: true });
          setupConnection(connection);
        });

        peer.on('error', function(err) {
          console.error("Peer error:", err);
          transferStatusText.textContent = "Connection error. Please rescan QR.";
          btnDownloadText.textContent = "Connection Failed";
        });
      }

      function setupConnection(conn) {
        conn.on('open', function() {
          transferStatusText.textContent = "Connected! Starting stream...";
          btnDownload.disabled = false;
          btnDownload.onclick = function() {
            if (isCompleted && currentDownloadUrl) {
              triggerBrowserSave(currentDownloadUrl, activeFileName);
            }
          };

          // Send handshake
          conn.send({
            type: 'DEVICE_INFO',
            device: navigator.userAgent.includes('Mobile') ? 'Mobile Device' : 'Web Receiver'
          });
        });

        conn.on('data', function(msg) {
          handleIncomingData(msg);
        });

        conn.on('close', function() {
          if (!isCompleted) {
            transferStatusText.textContent = "Sender disconnected";
          }
        });
      }

      function handleIncomingData(msg) {
        if (!msg || !msg.type) return;

        // 1. Text or Link Payload
        if (msg.type === 'TEXT_PAYLOAD' || msg.type === 'TEXT_MSG') {
          const rawText = msg.text || '';
          isCompleted = true;
          portalBadgeTag.textContent = 'BEAMED CONTENT';
          fileNameHeading.textContent = msg.subType === 'link' || rawText.startsWith('http') ? 'Received Link' : 'Received Text';
          fileSizeLabel.textContent = rawText.length + ' characters';
          fileEmoji.textContent = rawText.startsWith('http') ? '🔗' : '📝';

          streamContainer.style.display = 'none';
          btnDownload.style.display = 'none';
          pulseRing.style.display = 'none';

          textPayloadContainer.style.display = 'block';
          textBox.textContent = rawText;

          if (rawText.startsWith('http://') || rawText.startsWith('https://')) {
            btnOpenLink.href = rawText;
            btnOpenLink.style.display = 'inline-flex';
          }

          btnCopyText.onclick = function() {
            navigator.clipboard.writeText(rawText).then(function() {
              btnCopyText.innerHTML = '<span>✓ Copied to Clipboard!</span>';
              setTimeout(function() {
                btnCopyText.innerHTML = '<span>📋 Copy to Clipboard</span>';
              }, 2500);
            }).catch(function() {
              // Fallback
              const ta = document.createElement('textarea');
              ta.value = rawText;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              btnCopyText.innerHTML = '<span>✓ Copied!</span>';
            });
          };

          successTitle.textContent = 'Text Received Successfully!';
          successSub.textContent = 'Content was transferred in-flight without cloud storage.';
          successBox.style.display = 'flex';
          return;
        }

        // 2. Binary File Chunks
        if (msg.type === 'FILE_START') {
          activeFileName = msg.fileName;
          fileNameHeading.textContent = msg.fileName;
          fileSizeLabel.textContent = formatBytes(msg.fileSize) + " • Streaming to RAM";
          transferStatusText.textContent = "Streaming file chunks...";
          btnDownloadText.textContent = "Downloading " + formatBytes(msg.fileSize) + "...";

          chunksMap.set(msg.fileId, {
            name: msg.fileName,
            size: msg.fileSize,
            mime: msg.fileMime || 'application/octet-stream',
            chunks: [],
            receivedBytes: 0,
            lastTime: Date.now(),
            lastBytes: 0
          });
        } else if (msg.type === 'FILE_CHUNK') {
          const entry = chunksMap.get(msg.fileId);
          if (!entry) return;

          entry.chunks.push(msg.data);
          entry.receivedBytes += msg.data.byteLength;

          const pct = Math.min(100, Math.round((entry.receivedBytes / entry.size) * 100));
          progressBarFill.style.width = pct + '%';
          progressPctLabel.textContent = pct + '%';
          bytesTransferredLabel.textContent = formatBytes(entry.receivedBytes) + ' / ' + formatBytes(entry.size);

          const now = Date.now();
          const elapsed = (now - entry.lastTime) / 1000;
          if (elapsed >= 0.25) {
            const speed = (entry.receivedBytes - entry.lastBytes) / Math.max(elapsed, 0.001);
            transferSpeedText.textContent = formatBytes(speed) + '/s';
            entry.lastTime = now;
            entry.lastBytes = entry.receivedBytes;
          }
        } else if (msg.type === 'FILE_END' || msg.type === 'complete') {
          const entry = chunksMap.get(msg.fileId);
          if (!entry) return;

          isCompleted = true;
          const blob = new Blob(entry.chunks, { type: entry.mime });
          currentDownloadUrl = URL.createObjectURL(blob);
          activeFileName = entry.name;

          // Automatic instant native download to device
          triggerBrowserSave(currentDownloadUrl, activeFileName);

          progressBarFill.style.width = '100%';
          progressPctLabel.textContent = '100%';
          transferStatusText.textContent = "✓ File downloaded!";
          transferSpeedText.textContent = "Finished";
          successBox.style.display = 'flex';
          pulseRing.style.display = 'none';

          btnDownload.disabled = false;
          btnDownloadText.textContent = "📥 Save Again (" + formatBytes(entry.size) + ")";
          btnDownload.onclick = function() {
            triggerBrowserSave(currentDownloadUrl, activeFileName);
          };

          // Preview
          if (entry.mime.startsWith('image/')) {
            previewBox.innerHTML = '<img src="' + currentDownloadUrl + '" alt="' + activeFileName + '" />';
            previewBox.style.display = 'block';
          } else if (entry.mime.startsWith('video/')) {
            previewBox.innerHTML = '<video controls playsinline src="' + currentDownloadUrl + '"></video>';
            previewBox.style.display = 'block';
          }

          chunksMap.delete(msg.fileId);
        }
      }

      function triggerBrowserSave(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function formatBytes(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      initP2P();
    })();
  </script>
</body>
</html>
